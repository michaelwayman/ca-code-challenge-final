[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-auth"
version = "0.2.0"
description = "Access-token contract (issue, verify, JWKS), roles and DRF auth for the main app and auth service"
requires-python = ">=3.11"
dependencies = ["PyJWT[crypto]>=2.8,<3"]

[project.optional-dependencies]
drf = ["djangorestframework>=3.15,<4"]
test = ["pytest>=8", "django>=5,<6", "djangorestframework>=3.15,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
