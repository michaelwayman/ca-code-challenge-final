[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cauth"
version = "0.1.0"
description = "Shared JWT verification and DRF auth helpers for the main app and auth service"
requires-python = ">=3.11"
dependencies = ["PyJWT[crypto]>=2.8,<3", "djangorestframework>=3.15,<4"]

[project.optional-dependencies]
test = ["pytest>=8", "django>=5,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
