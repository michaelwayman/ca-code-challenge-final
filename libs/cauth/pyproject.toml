[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cauth"
dynamic = ["version"]
description = "Shared JWT verification and DRF auth helpers for the main app and auth service"
requires-python = ">=3.11"
dependencies = ["PyJWT[crypto]>=2.8,<3", "djangorestframework>=3.15,<4"]

[project.optional-dependencies]
test = ["pytest>=8", "django>=5,<6"]

[tool.setuptools.dynamic]
version = { attr = "cauth.__version__" }  # the one place the version lives

[tool.setuptools.package-data]
cauth = ["py.typed"]  # PEP 561: services type-check against the library

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
