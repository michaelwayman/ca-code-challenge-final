services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-wp}
      MYSQL_USER: ${WORDPRESS_DB_USER:-wp}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wp}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/dump.sql:/docker-entrypoint-initdb.d/01-dump.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6.9-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wp}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wp}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wp}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: "1"
    volumes:
      - wp_files:/var/www/html
      - ./wp-content/plugins:/var/www/html/wp-content/plugins
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./wp-content/themes/consumer-reviews:/var/www/html/wp-content/themes/consumer-reviews
      - ./wp-content/uploads:/var/www/html/wp-content/uploads
    entrypoint:
      - bash
      - -c
      - |
        mkdir -p /var/www/html/wp-content/themes /var/www/html/wp-content/languages
        cp -rn /usr/src/wordpress/wp-content/themes/. /var/www/html/wp-content/themes/ 2>/dev/null || true
        cp -rn /usr/src/wordpress/wp-content/languages/. /var/www/html/wp-content/languages/ 2>/dev/null || true
        [ -f /var/www/html/wp-content/index.php ] || cp /usr/src/wordpress/wp-content/index.php /var/www/html/wp-content/index.php 2>/dev/null || true
        exec docker-entrypoint.sh apache2-foreground

  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    user: "0:0"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wp}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wp}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wp}
      WP_SITE_URL: ${WP_SITE_URL:-http://localhost:8080}
      WP_SITE_TITLE: ${WP_SITE_TITLE:-Brand Reviews Challenge}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-admin}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@example.com}
    volumes:
      - wp_files:/var/www/html
      - ./wp-content/plugins:/var/www/html/wp-content/plugins
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./wp-content/themes/consumer-reviews:/var/www/html/wp-content/themes/consumer-reviews
      - ./wp-content/uploads:/var/www/html/wp-content/uploads
      - ./scripts:/scripts:ro
    entrypoint: ["wp", "--allow-root"]

  phpmyadmin:
    image: phpmyadmin:5
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${WORDPRESS_DB_USER:-wp}
      PMA_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wp}
      UPLOAD_LIMIT: 256M

  # --- Auth service: own container, own Postgres ---
  auth-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-auth}
      POSTGRES_USER: ${AUTH_DB_USER:-auth}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-auth}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      AUTH_DB_HOST: auth-db
      AUTH_DB_NAME: ${AUTH_DB_NAME:-auth}
      AUTH_DB_USER: ${AUTH_DB_USER:-auth}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-dev-only-auth-secret}
      AUTH_KEYS_DIR: /keys
      # Read-only source for import_wp_users: the WP MariaDB above.
      WP_DB_HOST: db
      WP_DB_PORT: "3306"
      WP_DB_NAME: ${WORDPRESS_DB_NAME:-wp}
      WP_DB_USER: ${WORDPRESS_DB_USER:-wp}
      WP_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wp}
      WP_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
    volumes:
      - ./auth:/srv/auth
      - auth_keys:/keys
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- Main app: own container, own Postgres; no auth DB credentials ---
  app-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${APP_DB_NAME:-app}
      POSTGRES_USER: ${APP_DB_USER:-app}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-app}
    volumes:
      - app_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    depends_on:
      app-db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_DB_HOST: app-db
      APP_DB_NAME: ${APP_DB_NAME:-app}
      APP_DB_USER: ${APP_DB_USER:-app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-dev-only-app-secret}
      # Public keys only; deliberately no depends_on auth, so the app runs without it.
      AUTH_JWKS_URL: http://auth:8001/.well-known/jwks.json
      # Read-only source for import_wp: the WP MariaDB above.
      WP_DB_HOST: db
      WP_DB_PORT: "3306"
      WP_DB_NAME: ${WORDPRESS_DB_NAME:-wp}
      WP_DB_USER: ${WORDPRESS_DB_USER:-wp}
      WP_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wp}
      WP_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
    volumes:
      - ./app:/srv/app
      - ./frontend:/srv/frontend:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
  wp_files:
  auth_db_data:
  auth_keys:
  app_db_data:
