[mypy]
python_version = 3.12
strict = True
plugins = mypy_django_plugin.main, mypy_drf_plugin.main
mypy_path = services/app
exclude = (migrations|/tests?\.py$|/test_[^/]*\.py$)

[mypy.plugins.django-stubs]
django_settings_module = config.settings

# Third-party packages that ship no stubs.
[mypy-pymysql.*]
ignore_missing_imports = True
